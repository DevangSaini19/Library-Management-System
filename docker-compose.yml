name: library-management-system

services:
  # Local MongoDB for development. Started with `npm run db:start` from the repo root.
  # Data persists in the `mongodb-data` volume, so `npm run db:seed` is only needed once
  # (or after `npm run db:reset`).
  mongodb:
    image: mongo:8
    restart: unless-stopped
    command: ["--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongodb-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # Optional: use this instead of `mongodb` if you are doing the MongoDB Search /
  # Vector Search workshop labs (the plain `mongo` image has no $search / $vectorSearch).
  # Same DATABASE_URI works; see README "Search labs" for details.
  # mongodb-atlas-local:
  #   image: mongodb/mongodb-atlas-local:8.0.3-20250506T093411Z
  #   restart: unless-stopped
  #   ports:
  #     - "27017:27017"
  #   volumes:
  #     - mongodb-data:/data/db

volumes:
  mongodb-data:
